<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de turnos — Feria Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F6F0;
    --card: #FFFFFF;
    --ink: #1E2E27;
    --ink-soft: #55645C;
    --line: #D9E1D4;
    --accent: #DB5A2C;
    --accent-soft: #FBE7DD;
    --open: #2E7D57;
    --open-soft: #E1F1E7;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16201A; --card: #1D2A22; --ink: #EDF3EC; --ink-soft: #A9B7AC;
      --line: #33443A; --accent: #F07A4C; --accent-soft: #3A2620;
      --open: #55B98A; --open-soft: #1E3A2C;
    }
  }
  :root[data-theme="dark"] {
    --paper: #16201A; --card: #1D2A22; --ink: #EDF3EC; --ink-soft: #A9B7AC;
    --line: #33443A; --accent: #F07A4C; --accent-soft: #3A2620;
    --open: #55B98A; --open-soft: #1E3A2C;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }
  header.hero {
    background: var(--ink); color: var(--paper); border-radius: var(--radius);
    padding: 26px 22px 22px; margin-bottom: 22px; position: relative; overflow: hidden;
  }
  header.hero::after {
    content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px;
    background: var(--accent); border-radius: 50%; opacity: 0.35;
  }
  header.hero h1 { font-family: "Kalam", cursive; font-size: 2rem; line-height: 1.05; margin: 0 0 6px; position: relative; }
  header.hero p { margin: 0; font-size: 0.95rem; color: #CBD6C7; position: relative; max-width: 32ch; }
  section.day { margin-bottom: 26px; }
  .day-title {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 4px 10px; border-bottom: 2px solid var(--line); margin-bottom: 10px;
  }
  .day-title h2 { font-family: "Kalam", cursive; font-size: 1.35rem; margin: 0; }
  .day-title span { font-size: 0.82rem; color: var(--ink-soft); font-weight: 600; }
  ul.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.slot { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .slot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .slot-time { font-weight: 700; font-size: 0.98rem; }
  .pill { font-size: 0.78rem; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.requested { background: var(--accent-soft); color: var(--accent); }
  button.reserve-btn {
    border: none; background: var(--open); color: #fff; font-weight: 600; font-size: 0.85rem;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  button.reserve-btn:active { transform: scale(0.97); }
  button.reserve-btn:disabled { background: var(--line); color: var(--ink-soft); }
  form.book-form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; animation: openIn 0.18s ease-out; }
  @keyframes openIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  form.book-form input {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem;
    font-family: inherit; background: var(--paper); color: var(--ink);
  }
  form.book-form .form-actions { display: flex; gap: 8px; }
  form.book-form .form-actions button {
    flex: 1; border: none; border-radius: 10px; padding: 10px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }
  form.book-form .confirm { background: var(--accent); color: #fff; }
  form.book-form .cancel { background: var(--line); color: var(--ink); }
  .note { text-align: center; font-size: 0.8rem; color: var(--ink-soft); margin-top: 6px; padding: 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Lanzamiento de la feria escolar</h1>
    <p>Elegí tu turno para la visita. Sábado 17/10 de 8 a 20 h y domingo 18/10 de 10 a 19 h. Un cliente por turno.</p>
  </header>
  <div id="days"></div>
  <p class="note">Al tocar "Pedir turno" se abre WhatsApp con tu solicitud. Te confirmamos la disponibilidad por ese chat.</p>
</div>

<script>
(function () {
  var WHATSAPP_NUMBER = "595986966361";

  var slots = [
    {"id":"s1-08","day":"Sábado","date":"17/10/2026","start":"08:00","end":"09:00"},
    {"id":"s1-09","day":"Sábado","date":"17/10/2026","start":"09:00","end":"10:00"},
    {"id":"s1-10","day":"Sábado","date":"17/10/2026","start":"10:00","end":"11:00"},
    {"id":"s1-11","day":"Sábado","date":"17/10/2026","start":"11:00","end":"12:00"},
    {"id":"s1-12","day":"Sábado","date":"17/10/2026","start":"12:00","end":"13:00"},
    {"id":"s1-13","day":"Sábado","date":"17/10/2026","start":"13:00","end":"14:00"},
    {"id":"s1-14","day":"Sábado","date":"17/10/2026","start":"14:00","end":"15:00"},
    {"id":"s1-15","day":"Sábado","date":"17/10/2026","start":"15:00","end":"16:00"},
    {"id":"s1-16","day":"Sábado","date":"17/10/2026","start":"16:00","end":"17:00"},
    {"id":"s1-17","day":"Sábado","date":"17/10/2026","start":"17:00","end":"18:00"},
    {"id":"s1-18","day":"Sábado","date":"17/10/2026","start":"18:00","end":"19:00"},
    {"id":"s1-19","day":"Sábado","date":"17/10/2026","start":"19:00","end":"20:00"},
    {"id":"s2-10","day":"Domingo","date":"18/10/2026","start":"10:00","end":"11:00"},
    {"id":"s2-11","day":"Domingo","date":"18/10/2026","start":"11:00","end":"12:00"},
    {"id":"s2-12","day":"Domingo","date":"18/10/2026","start":"12:00","end":"13:00"},
    {"id":"s2-13","day":"Domingo","date":"18/10/2026","start":"13:00","end":"14:00"},
    {"id":"s2-14","day":"Domingo","date":"18/10/2026","start":"14:00","end":"15:00"},
    {"id":"s2-15","day":"Domingo","date":"18/10/2026","start":"15:00","end":"16:00"},
    {"id":"s2-16","day":"Domingo","date":"18/10/2026","start":"16:00","end":"17:00"},
    {"id":"s2-17","day":"Domingo","date":"18/10/2026","start":"17:00","end":"18:00"},
    {"id":"s2-18","day":"Domingo","date":"18/10/2026","start":"18:00","end":"19:00"}
  ];

  // ─────────────────────────────────────────────────────────────
  // PARA MARCAR UN TURNO COMO OCUPADO:
  // agregá una línea nueva acá abajo (entre las comillas ` ` ),
  // con el ID del turno, un signo = y el nombre del cliente.
  // NO borres nada más, NO uses comas ni comillas dobles.
  //
  // Ejemplo:
  //   s1-08=Juan Pérez
  //   s2-14=Maria Gómez
  //
  // Los IDs son: s1-08 a s1-19 (sábado, por hora de inicio)
  // y s2-10 a s2-18 (domingo, por hora de inicio).
  // Guardá el cambio en GitHub (ícono de lápiz → Commit changes).
  // ─────────────────────────────────────────────────────────────
  var TAKEN_TEXT = `s2-10=Cocoa Py
  s1-16=Bea Libreria
  s1-17=Librería Organizate
  s1-14=Casa Robert
  `;

  var takenMap = {};
  TAKEN_TEXT.split('\n').forEach(function (line) {
    line = line.trim();
    if (!line || line.indexOf('=') === -1) return;
    var idx = line.indexOf('=');
    var id = line.slice(0, idx).trim();
    var name = line.slice(idx + 1).trim();
    if (id && name) takenMap[id] = name;
  });

  var STORAGE_KEY = "feria-escolar-solicitados";
  function getRequested() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function setRequested(map) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  var daysContainer = document.getElementById('days');
  var openFormId = null;
  var requested = getRequested();

  function groupByDay(list) {
    var groups = [], byKey = {};
    list.forEach(function (s) {
      var key = s.day + s.date;
      if (!byKey[key]) { byKey[key] = { day: s.day, date: s.date, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(s);
    });
    return groups;
  }

  function buildWhatsAppLink(slot, name) {
    var text = "Hola! Quiero pedir el turno de " + slot.day + " " + slot.date +
      " de " + slot.start + " a " + slot.end + " para la feria escolar. Mi nombre es " + name + ".";
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
  }

  function render() {
    var groups = groupByDay(slots);
    daysContainer.innerHTML = '';
    groups.forEach(function (g) {
      var section = document.createElement('section');
      section.className = 'day';

      var titleRow = document.createElement('div');
      titleRow.className = 'day-title';
      var h2 = document.createElement('h2'); h2.textContent = g.day;
      var span = document.createElement('span'); span.textContent = g.date;
      titleRow.appendChild(h2); titleRow.appendChild(span);
      section.appendChild(titleRow);

      var ul = document.createElement('ul');
      ul.className = 'slots';

      g.items.forEach(function (slot) {
        var li = document.createElement('li');
        li.className = 'slot';
        var row = document.createElement('div');
        row.className = 'slot-row';
        var time = document.createElement('div');
        time.className = 'slot-time';
        time.textContent = slot.start + ' – ' + slot.end;
        row.appendChild(time);

        var takenName = takenMap[slot.id];
        var confirmedTaken = !!takenName;
        var alreadyRequested = !!requested[slot.id];

        if (confirmedTaken) {
          var pillTaken = document.createElement('span');
          pillTaken.className = 'pill requested';
          pillTaken.textContent = 'Reservado';
          row.appendChild(pillTaken);
          li.appendChild(row);
          var nameEl = document.createElement('div');
          nameEl.className = 'note';
          nameEl.style.margin = '4px 0 0';
          nameEl.style.textAlign = 'left';
          nameEl.textContent = takenName;
          li.appendChild(nameEl);
        } else if (alreadyRequested) {
          var pill = document.createElement('span');
          pill.className = 'pill requested';
          pill.textContent = 'Ya lo pediste';
          row.appendChild(pill);
          li.appendChild(row);
        } else {
          var btn = document.createElement('button');
          btn.className = 'reserve-btn';
          btn.textContent = 'Pedir turno';
          btn.addEventListener('click', function () {
            openFormId = (openFormId === slot.id) ? null : slot.id;
            render();
          });
          row.appendChild(btn);
          li.appendChild(row);

          if (openFormId === slot.id) {
            var form = document.createElement('form');
            form.className = 'book-form';
            var input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Tu nombre';
            input.required = true;
            form.appendChild(input);

            var actions = document.createElement('div');
            actions.className = 'form-actions';
            var confirmBtn = document.createElement('button');
            confirmBtn.type = 'submit';
            confirmBtn.className = 'confirm';
            confirmBtn.textContent = 'Enviar por WhatsApp';
            var cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'cancel';
            cancelBtn.textContent = 'Cancelar';
            cancelBtn.addEventListener('click', function () { openFormId = null; render(); });
            actions.appendChild(confirmBtn);
            actions.appendChild(cancelBtn);
            form.appendChild(actions);

            form.addEventListener('submit', function (e) {
              e.preventDefault();
              var name = input.value.trim();
              if (!name) return;
              requested[slot.id] = name;
              setRequested(requested);
              openFormId = null;
              window.open(buildWhatsAppLink(slot, name), '_blank');
              render();
            });

            li.appendChild(form);
            setTimeout(function () { input.focus(); }, 0);
          }
        }

        ul.appendChild(li);
      });

      section.appendChild(ul);
      daysContainer.appendChild(section);
    });
  }

  try {
    render();
  } catch (err) {
    daysContainer.innerHTML = '<p class="note">Hubo un problema al mostrar los turnos. Revisá que la lista de nombres reservados no tenga errores de tipeo.</p>';
  }
})();
</script>
</body>
</html>
